name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Check public hygiene
        run: python tools/check_public_hygiene.py
      - name: Check repository integrity
        run: python tools/check_repo_integrity.py --require-jsonschema
      - name: Check Permit-to-X contract artifacts
        run: python tools/check_permit_to_x_artifacts.py
      - name: Check verifier-claim pack integrity
        run: python tools/check_pack_integrity.py
      - name: Check fact-profile freeze
        run: python tools/check_fact_profile_freeze.py
      - name: Verify action-classification derivation corpus
        run: python test-vectors/action_classification_derivation/v1/reference_executor.py
      - name: Verify claim-registry and recipe extension chains
        run: python test-vectors/claim_registry_chain/v1/reference_executor.py
      - name: Verify permit co-signature golden vectors
        run: node test-vectors/permit_co_signature/v1/reference_verify.mjs
      - name: Verify target-bound permit co-signature golden vectors
        run: node test-vectors/permit_co_signature/v2/reference_verify.mjs
