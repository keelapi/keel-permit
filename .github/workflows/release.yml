name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (e.g. v1.19.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach assets to the release
      id-token: write        # Sigstore OIDC identity for attestation
      attestations: write    # record the provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the tag and its tree resolve.
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deterministic release bundle
        id: build
        run: |
          python tools/build_release_bundle.py \
            --ref "${{ github.event.inputs.ref || github.ref_name }}" \
            --out dist
          echo "version=$(python -c "import json;print(json.load(open('dist/release-manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Verify the bundle reproduces
        # The published reproduce instruction is a claim. Check it here so a
        # release cannot ship with an instruction that does not work.
        run: |
          set -euo pipefail
          V="${{ steps.build.outputs.version }}"
          CLAIMED=$(python -c "import json;print(json.load(open('dist/release-manifest.json'))['bundle']['sha256'])")
          ACTUAL=$(git archive --prefix="keel-permit-$V/" --format=tar.gz \
            "${{ github.event.inputs.ref || github.ref_name }}" | sha256sum | cut -d' ' -f1)
          echo "claimed: $CLAIMED"
          echo "rebuilt: $ACTUAL"
          test "$CLAIMED" = "$ACTUAL"

          # The manifest's commit must be the commit the ref points at. An
          # annotated tag rev-parses to the tag object, so a manifest can
          # otherwise publish an identifier that names no commit at all.
          TAG="${{ github.event.inputs.ref || github.ref_name }}"
          MCOMMIT=$(python -c "import json;print(json.load(open('dist/release-manifest.json'))['commit'])")
          TCOMMIT=$(git rev-list -n1 "$TAG")
          echo "manifest commit: $MCOMMIT"
          echo "ref commit     : $TCOMMIT"
          test "$MCOMMIT" = "$TCOMMIT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/keel-permit-*.tar.gz
            dist/release-manifest.json
            dist/SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          # Pushing a tag does not create a Release, and `gh release upload`
          # requires one to exist. This repository has five tags with no
          # release, which is exactly the state that would make an upload-only
          # step fail on its first run.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release for $TAG; creating it."
            gh release create "$TAG" --title "keel-permit $TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            dist/keel-permit-*.tar.gz \
            dist/release-manifest.json \
            dist/SHA256SUMS \
            --clobber
